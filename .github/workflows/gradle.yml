# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Forge Mod CI Build

on:
  push:
    branches: [ "1.21.1/dev" ]
  pull_request:
    branches: [ "1.21.1/dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build MOD with Gradle
      run: ./gradlew build

    - name: Locate built JAR
      id: locate
      run: |
        FILE=$(find build/libs -name "*.jar" | head -n 1)
        echo "mod_jar=$FILE" >> $GITHUB_OUTPUT

    - name: Rename and move to output folder
      run: |
        mkdir -p mod-package
        cp ${{ steps.locate.outputs.mod_jar }} mod-package/MyMod.jar

    - name: Upload MOD JAR
      uses: actions/upload-artifact@v3.1.2
      with:
        name: MyMod-Package
        path: mod-package/MyMod.jar

